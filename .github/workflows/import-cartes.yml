name: Import des cartes

on:
  workflow_dispatch:        # bouton "Run workflow" dans l'onglet Actions
  schedule:
    # 3 fois par jour : GitHub retarde souvent les tâches planifiées de plusieurs heures,
    # comme ça les nouveautés arrivent dans la journée quoi qu'il arrive
    - cron: '41 3 * * *'
    - cron: '41 10 * * *'
    - cron: '41 17 * * *'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Importer toutes les cartes Global
        run: node import/from-dokkandb.mjs
      - name: Enregistrer les cartes
        run: |
          git config user.name "dokkan-bot"
          git config user.email "dokkan-bot@users.noreply.github.com"
          git add web/data/cards.json web/data/extra.json web/data/top-teams.json
          git diff --cached --quiet || git commit -m "Mise à jour des cartes"
          git push
